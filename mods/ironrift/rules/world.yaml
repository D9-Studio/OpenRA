		TerrainSpeeds:
			Clear: 100
			Rough: 89
			Road: 111
			Bridge: 111
			Ore: 89
			Gems: 89
			Beach: 89
	Locomotor@WHEELED:
		Name: wheeled
		Crushes: mine, crate
		TerrainSpeeds:
			Clear: 100
			Rough: 50
			Road: 125
			Bridge: 125
			Ore: 88
			Gems: 88
			Beach: 50
	Locomotor@TRACKED:
		Name: tracked
		Crushes: wall, infantry, mine, crate
		TerrainSpeeds:
			Clear: 100
			Rough: 88
			Road: 125
			Bridge: 125
			Ore: 88
			Gems: 88
			Beach: 88
	Locomotor@HEAVYTRACKED:
		Name: heavytracked
		Crushes: wall, infantry, mine, crate
