		UseExtendedIndex: true
	Faction@magen:
		Name: faction-magen.name
		InternalName: magen
		Side: Magen
		Selectable: True
		Description: faction-magen.description
	Faction@muqawama:
		Name: faction-muqawama.name
		InternalName: muqawama
		Side: Muqawama
		Selectable: True
		Description: faction-muqawama.description
	Faction@random:
		Name: faction-random.name
		InternalName: Random
		RandomFactionMembers: magen, muqawama
		Side: Random
		Description: faction-random.description
	ResourceRenderer:
		ResourceTypes:
			Ore:
				Sequences: gold01, gold02, gold03, gold04
				Palette: player
				Name: resource-supplies
			Gems:
				Sequences: gem01, gem02, gem03, gem04
				Palette: player
				Name: resource-technology

World:
	Inherits: ^BaseWorld
	ChatCommands:
	DevCommands:
	DebugVisualizationCommands:
	PathFinderOverlay:
	HierarchicalPathFinderOverlay:
	ActorMapOverlay:
	PlayerCommands:
	HelpCommand:
	ScreenShaker:
	BuildingInfluence:
	ProductionQueueFromSelection:
		ProductionPaletteWidget: PRODUCTION_PALETTE
	CustomTerrainDebugOverlay:
	CrateSpawner:
		Minimum: 1
		Maximum: 3
		SpawnInterval: 4500
		WaterChance: 10
		InitialSpawnDelay: 2000
		CheckboxDisplayOrder: 1
	SmudgeLayer@SCORCH:
		Type: Scorch
		Sequence: scorches
		SmokeChance: 50
		SmokeImage: scorch_flames
		SmokeSequences: large_flame, medium_flame, small_flame
		MaxSmokeOffsetDistance: 341
	SmudgeLayer@CRATER:
		Type: Crater
		Sequence: craters
		SmokeChance: 25
		SmokeImage: smoke_m
		SmokeSequences: idle
		MaxSmokeOffsetDistance: 213
	ResourceLayer:
		RecalculateResourceDensity: true
		ResourceTypes:
			Ore:
				ResourceIndex: 1
				TerrainType: Ore
				AllowedTerrainTypes: Clear, Road
				MaxDensity: 12
			Gems:
				ResourceIndex: 2
				TerrainType: Gems
				AllowedTerrainTypes: Clear, Road
				MaxDensity: 3
	ResourceClaimLayer:
	WarheadDebugOverlay:
	SpawnMapActors:
	MapBuildRadius:
		AllyBuildRadiusCheckboxDisplayOrder: 4
		BuildRadiusCheckboxDisplayOrder: 5
	MapOptions:
		ShortGameCheckboxDisplayOrder: 2
		TechLevelDropdownDisplayOrder: 3
	StartingUnits@mcvonly:
		Class: none
		ClassName: options-starting-units.mcv-only
		Factions: magen, muqawama
		BaseActor: mcv
	StartingUnits@lightsupport:
		Class: light
		ClassName: options-starting-units.light-support
		Factions: magen, muqawama
		BaseActor: mcv
		SupportActors: loham, loham, eitan
		InnerSupportRadius: 3
		OuterSupportRadius: 5
	LobbyOptions:
	SpawnStartingUnits:
	CreateMapPlayers:
	CircleButton:
	ObjectivesPanel:
		PanelName: MISSION_OBJECTIVES
		ExitDelay: 1500

EditorWorld:
	Inherits: ^BaseWorld
	EditorActorLayer:
	EditorResourceLayer:
	EditorCursorLayer:
	LoadWidgetAtGameStart:
		ShellmapRoot:
		IngameRoot:
		EditorRoot: EDITOR_ROOT
		GameSaveLoadingRoot:
		ClearRoot: true
