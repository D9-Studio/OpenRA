# ============================================================
# SHARED / MCV
# ============================================================

MCV:
	Inherits: ^HeavyTrackedVehicle
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	Valued:
		Cost: 2500
	Tooltip:
		Name: actor-mcv.name
	Health:
		HP: 60000
	Armor:
		Type: Heavy
	Mobile:
		Speed: 56
	RevealsShroud:
		Range: 8c0
	GrantConditionOnFaction@MUQ:
		Factions: muqawama
		Condition: muq-faction
	Transforms:
		RequiresCondition: !muq-faction
		IntoActor: mcmd
		Offset: -1,-1
		Facing: 384
		TransformSounds: placbldg.aud
		NoTransformNotification: BuildingCannotPlaceAudio
	Transforms@MUQ:
		RequiresCondition: muq-faction
		IntoActor: qcmd
		Offset: -1,-1
		Facing: 384
		TransformSounds: placbldg.aud
		NoTransformNotification: BuildingCannotPlaceAudio
	INotifyTransform:
	WithFacingSpriteBody:
	Selectable:
		DecorationBounds: 1536, 1536
