# Crate actor — required by CrateSpawner in world.yaml
CRATE:
	Inherits@1: ^SpriteActor
	Interactable:
		Bounds: 1024, 1024
	HiddenUnderFog:
	Tooltip:
		Name: actor-crate.name
		GenericName: actor-crate.generic-name
		ShowOwnerRow: false
	Crate:
		Duration: 4500
		TerrainTypes: Clear, Rough, Road, Ore, Beach
	RenderSprites:
		Palette: effect
		Image: scrate
	WithCrateBody:
		LandSequence: land
		WaterSequence: water
	GiveCashCrateAction:
		Amount: 1000
		SelectionShares: 50
		UseCashTick: true
	LevelUpCrateAction:
		SelectionShares: 40
	HealActorsCrateAction:
		Sound: heal2.aud
		SelectionShares: 10

# Editor / system actors (aligned with RA so maps and tools work)

CAMERA:
	Interactable:
	EditorOnlyTooltip:
		Name: actor-camera-name
	Immobile:
		OccupiesSpace: false
	RevealsShroud:
		Range: 10c0
		Type: CenterPosition
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
	RenderSpritesEditorOnly:
		Image: camera
	MapEditorData:
		Categories: System

mpspawn:
	Interactable:
	EditorOnlyTooltip:
		Name: actor-mpspawn-name
	Immobile:
		OccupiesSpace: false
	WithSpriteBody:
	RenderSpritesEditorOnly:
	BodyOrientation:
		QuantizedFacings: 1
	MapEditorData:
		Categories: System
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral

waypoint:
	Interactable:
	EditorOnlyTooltip:
		Name: actor-waypoint-name
	Immobile:
		OccupiesSpace: false
	WithSpriteBody:
	RenderSpritesEditorOnly:
	BodyOrientation:
		QuantizedFacings: 1
	MapEditorData:
		Categories: System

# Lobby color preview (requires ColorPickerManager on World; same pattern as RA fact.colorpicker)
mcmd.colorpicker:
	Inherits: MCMD
	-Buildable:
	-BaseBuilding:
	RenderSprites:
		Image: mcmd
		Palette: colorpicker
