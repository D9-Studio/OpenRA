# Bot configuration — all BotModules must live on the Player actor (not World).

Player:
	ModularBot@RushAI:
		Name: Rush AI
		Type: rush
	ModularBot@NormalAI:
		Name: Normal AI
		Type: normal
	GrantConditionOnBotOwner@rush:
		Condition: enable-rush-ai
		Bots: rush
	GrantConditionOnBotOwner@normal:
		Condition: enable-normal-ai
		Bots: normal
	ResourceMapBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai
		ValuableResourceTypes: Ore, Gems
		HarvesterTypes: mhvr, qhvr
		RefineryTypes: mref, qref
		EnemyBaseBuildingTypes: mcmd, qcmd, mref, qref, mbar, qbar, mfact, qfact, mair, qhang, mdome, mpil, qrpit, mpwr, qpwr, mrad, mtec, qprop
	HarvesterBotModule@rush:
		RequiresCondition: enable-rush-ai
		HarvesterTypes: mhvr, qhvr
		RefineryTypes: mref, qref
		InitialHarvesters: 2
	HarvesterBotModule@normal:
		RequiresCondition: enable-normal-ai
		HarvesterTypes: mhvr, qhvr
		RefineryTypes: mref, qref
		InitialHarvesters: 4
	BuildingRepairBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai
	BaseBuilderBotModule@rush:
		RequiresCondition: enable-rush-ai
		MinimumExcessPower: 0
		MaximumExcessPower: 160
		ExcessPowerIncrement: 40
		ExcessPowerIncreaseThreshold: 4
		ConstructionYardTypes: mcmd, qcmd
		RefineryTypes: mref, qref
		PowerTypes: mpwr, qpwr
		ExpansionTolerate: 0
		ForceExpansionTolerate: 0
		TechTypes: mrad, mair, mtec, qprop, qhang
		InititalMinimumRefineryCount: 0
		AdditionalMinimumRefineryCount: 2
		ProductionTypes: mbar, mfact, qbar, qfact, mair, qhang
		NewProductionCashThreshold: 7000
		DefenseTypes: mdome, mpil, qrpit
		BuildingLimits:
			mbar: 4
			qbar: 4
			mfact: 4
			qfact: 4
			mrad: 1
			mair: 1
			mtec: 1
			qprop: 1
			qhang: 1
			mdome: 2
			mpil: 4
			qrpit: 4
		BuildingFractions:
			mpwr: 1
			qpwr: 1
			mref: 1
			qref: 1
			mbar: 3
			qbar: 3
			mfact: 4
			qfact: 4
			mpil: 3
			mdome: 3
			qrpit: 3
			mrad: 1
			mair: 1
			mtec: 1
			qprop: 1
			qhang: 1
